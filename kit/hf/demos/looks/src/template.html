<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <!--HF:KIT-->
  </head>
  <body>
    <div id="root" data-composition-id="looks" data-start="0" data-duration="__TOTAL__" data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px;overflow:hidden">
      <video id="aroll" class="clip" src="assets/take.mp4" muted playsinline data-start="0" data-duration="__TOTAL__" data-media-start="0" data-track-index="2"></video>
    </div>
    <script>
      /*DATA*/
      // FIXTURE: the same kit components in one look (D.look), kit/hf/demos/looks/check.mjs measures them. Made-up content;
      // a check page, not an edit. 0-4 s a PR + a stamp, 4-8 s checklist + note, 8-12 s scoreboard + flow,
      // 12-16 s code + compare, 16-20 s sketch + stickman + a marker note.
      (function () {
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["looks"] = tl;                                            // the linter looks for this line
        const ROOT = document.getElementById("root");
        const K = HF.kit({ tl, id: "looks", width: 1920, height: 1080, words: D.words, pieces: D.pieces });
        const st = HF.stage(K, ROOT, { aroll: "aroll" });
        let P, stage, S = null;
        if (D.look === "canvas_studio" || (D.look === "whitespace" && D.frame !== "studio")) {   // no S: the canvas's own parts
          const CV = HF.canvas(K, ROOT, { w: 5760, h: 3240, look: D.look });               // (C.parts) in a flat station
          P = CV.parts;
          const stn = CV.station(0, D.total + 1, "mid", [CV.CW / 2, CV.CH / 2]);
          stage = (a, b) => P.layer(a, b, stn, { float: 0, push: 0, read: true });
          st.cam.style.display = "none";
        } else if (D.look === "paper_studio") {               // the paper-studio frame has no S: HF.parts on its paper
          P = HF.parts(K, ROOT, { z: 6 });
          stage = (a, b) => P.layer(a, b, P.FRONT, { read: true });
          st.cam.style.display = "none";
        } else {
          S = HF.studio(K, ROOT, st, { end: D.total, talk: D.total - 0.3, palette: D.look === "night" ? HF.night.PALETTE : undefined,
            look: D.look === "whitespace" ? "whitespace" : undefined,                            // whitespace:studio (HF.studio { look })
            chrome: { left: "fixture · " + D.look, badge: "1080p" } });
          if (D.look === "redline") HF.redline(S, st, {});
          if (D.look === "night") HF.night(S, st, { cut: null, left: "fixture · night" });
          if (D.look === "paper_collage") HF.paper(S, { look: true });
          S.beat(0, "graphic");
          P = S;
          stage = (a, b) => S.layer(a, b, S.BACK, { read: true });
        }
        const C = HF.C;
        // 0-4: a pull request (wide, as films use it) and a stamp
        { const L = stage(0.2, 4);
          P.ui.pr(L, 110, 170, 1200, 440, { title: "Fix the flaky upload test", branch: "agent/fix-upload", at: 0.4, tilt: false });
          P.ui.stamp("SHIPPED", 1180, 700, 2.4, { out: 3.8, size: 100 }); }
        // 4-8: a checklist and a note
        { const L = stage(4.2, 8);
          P.ui.checklist(L, 110, 150, 820, { title: "Today's plan", items: ["Reproduce the bug", "Write the failing test", "Ship the fix"], at: 4.4, rowsAt: 4.7, done: { 0: 5.6 }, next: { 1: 6.0 }, size: 34 });
          P.ui.note(L, 1010, 200, 800, { kicker: "HEADS-UP", title: "The test passed only when the upload finished first.", sub: "a race, not a bug in the upload", at: 4.8, h: 360 }); }
        // 8-12: a scoreboard and a flow
        { const L = stage(8.2, 12);
          const sb = P.scoreboard(L, 110, 220, 800, { title: "time to fix", rows: [{ name: "by hand", color: C.bad }, { name: "with the agent", color: C.ok }], at: 8.3, fmt: (v) => Math.round(v) + " min" });
          sb.set(0, 45, 9.0); sb.set(1, 12, 9.6); sb.win(1, 10.4);
          P.flow(L, { states: [
            { at: 8.5, x: 1010, y: 220, w: 800, h: 200, html: `<div style="position:absolute;left:40px;top:62px;font:600 40px/1.2 ${HF.F.body};color:${C.ink}">Find the flaky test</div>` },
            { at: 10.0, x: 1010, y: 220, w: 800, h: 360, html: `<div style="position:absolute;left:40px;top:50px;font:800 52px/1.15 ${HF.F.body};color:${C.ok}">✓ 1 test fixed</div><div style="position:absolute;left:40px;top:150px;font:500 36px/1.3 ${HF.F.body};color:${C.text}">a race on the upload callback</div>` },
          ] }); }
        // 12-16: code and a before/after
        { const L = stage(12.2, 16);
          const cw = HF.code(K, L, { x: 110, y: 190, w: 900, h: 520, title: "upload.test.js", lang: "js", size: 32,
            lines: ["test(\"uploads a file\", async () => {", "  const res = await upload(file);", "  await res.done;      // wait for it", "  expect(res.ok).toBe(true);", "});"] });
          cw.show(12.4); cw.highlight(13.6, [3, 3]);
          HF.compare(K, L, { x: 1080, y: 200, w: 740, rowH: 92, t: 12.8, left: { title: "before", tone: "bad", rows: ["flaky", "slow"] }, right: { title: "after", tone: "ok", rows: ["stable", "fast"] } }); }
        // 16-20: a sketch, a stickman and a marker note
        { const L = stage(16.2, D.total);
          const sk = HF.sketch(K, L, { x: 100, y: 160, w: 960, h: 620, seed: 3 });
          sk.node("a", { x: 220, y: 180, w: 300, h: 130, label: "Test" });
          sk.node("b", { x: 720, y: 180, w: 300, h: 130, label: "Fix", fill: C.accTint });
          sk.arrow("ab", "a", "b", { bend: 0.2 });
          sk.text("t", 470, 420, "until it passes", { size: 52 });
          sk.draw(["a", "ab", "b", "t"], 16.3, { stagger: 0.3 });
          const sv = P.svgLayer(L);
          const fig = Stickman.create(sv, { x: 1440, ground: 900, scale: 1.2 });
          fig.set("type"); fig.to(17.4, "handsOnHead", 0.3);
          const an = HF.annotate(K, L, { x: 0, y: 0, w: 1920, h: 1080 });
          an.note(1160, 220, "the hand-made bits", 17.0, { size: 60, rotate: -4 }); }
        if (window.Stickman) Stickman.drive(tl, D.total);
        if (S) S.box();
        K.finish(D.total);
      })();
    </script>
  </body>
</html>
