<!doctype html>
<html><head><meta charset="UTF-8"><title>FIXTURE: precheck speaker / density / transitions</title></head>
<body style="margin:0">
<!-- FIXTURE (2026-10-22, kit v11): a fake 60 s page that publishes the window.__speaker contract (MODE "speaker") or only
     window.__faceRect, as pages did before (MODE "fallback"), plus window.__trans and D.tracks, so kit/qa/precheck.mjs's
     SPEAKER, DENSITY and transition sections can be checked without an engine. No gsap: a timeline stand-in whose seek()
     sets the DOM for t. kit/hf/demos/audit/check.mjs and tests/test_precheck_speaker.py read it; the times below are
     what they expect.
       0-20 s   he is on in a card on the right, the framing never changes            -> framing HIGH (20 s)
       5-12 s   five cards up                                                         -> density MEDIUM
       14-17.4  seven cards up                                                        -> density HIGH
       20-24 s  a push: his face grows 12 %, the footage zoom 1.00 -> 1.28 (budget 1.25) -> upscale MEDIUM (contract only)
       24-30 s  a takeover (he is off)
       30-40 s  seated full frame, lens "hold" (a declared hold)                       -> nothing (fallback: framing MEDIUM)
       40-53 s  away 13 s                                                             -> away HIGH
       53-60 s  a card on the left
     transitions: whip 20, whip 24 (twice in a row -> MEDIUM), zoom 30, cut 40, cut 53 (cuts may repeat)
     the card on the right (0-24 s) and on the left (53-60 s) are one layout: card beside 52 % -> layout HIGH
     Two more fallback modes (no window.__speaker), for pages the old way of guessing on / off got wrong (review,
     2026-10-22):
       "boxhidden"  like claude-makes-claude: window.__box is hidden (op 0) the whole time while a full-frame A-roll
                    (<video id="aroll">) plays and __faceRect gives his face, which moves 3 % every 6 s
                                                       -> face on 100 %, full frame 100 %, no away / hook / framing
       "plate"      like oss-editor-reels-a: the first 3 s are his room plate (<video id="room">, full bleed) with the
                    speaker card hidden and __faceRect null; the 24-30 s takeover plays a screen recording full bleed
                    (<video id="scr">), which is not him  -> no hook finding, takeovers 6 s and 13 s, away MEDIUM
                    (estimated) -->
<div id="root" data-composition-id="speaker-fixture" data-start="0" data-duration="60" data-width="1920" data-height="1080"
     style="position:relative;width:1920px;height:1080px;overflow:hidden;background:#ffffff">
  <div id="world" data-decor="1" style="position:absolute;inset:0;z-index:0;background:#fafafa"></div>
  <div id="footage" style="position:absolute;inset:0;z-index:2">
    <video id="aroll" muted playsinline style="position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;background:#6d655d"></video>
    <video id="room" muted playsinline style="position:absolute;left:-96px;top:-54px;width:2112px;height:1188px;display:none;background:#6d655d"></video>
    <video id="scr" muted playsinline style="position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;background:#20232a"></video>
  </div>
  <div id="content" style="position:absolute;inset:0;z-index:3">
    <div id="spk" style="position:absolute;background:#8a7f74;border-radius:28px"></div>
    <div id="takeover" class="card" style="position:absolute;left:160px;top:140px;width:1600px;height:800px;background:#fff;box-shadow:0 0 0 1px #ddd"></div>
    <div id="decor" data-decor="1" style="position:absolute;left:40px;top:40px;width:600px;height:300px;background:#f1f1f4"></div>
    <div id="cap" class="cap" style="position:absolute;left:460px;top:940px;width:1000px;height:90px;background:rgba(0,0,0,.6)"></div>
  </div>
  <div id="chrome" style="position:absolute;left:1800px;top:20px;width:80px;height:40px;z-index:10;background:#eee"></div>
</div>
<script>
const MODE = "speaker";
const D = { total: 60, tracks: { face: { w: 560, h: 600, src_w: 1920, src_h: 1080, max_zoom: 1.25 } } };
const $ = (id) => document.getElementById(id);
const content = $("content"), cards = [];
for (let i = 0; i < 7; i++) {                                           // the density cards: a row of seven, 210 x 150
  const c = document.createElement("div");
  c.className = "card";
  c.style.cssText = `position:absolute;left:${60 + i * 160}px;top:${420 + (i % 2) * 170}px;width:150px;height:150px;background:#fff;box-shadow:0 0 0 1px #ccc`;
  content.append(c); cards.push(c);
}
const lerp = (a, b, u) => a + (b - a) * Math.max(0, Math.min(1, u));
// his shape and face over time (page px): null when he is off
function speakerAt(t) {
  if (t < 20) return { kind: "card", rect: { x: 1200, y: 240, w: 560, h: 600 }, face: { x: 1380, y: 330, w: 200, h: 240 }, zoom: 1, lens: "" };
  if (t < 24) { const u = (t - 20) / 4, k = lerp(1, 1.12, u), w = 200 * k, h = 240 * k;
    return { kind: "card", rect: { x: 1200, y: 240, w: 560, h: 600 }, face: { x: 1480 - w / 2, y: 450 - h / 2, w, h }, zoom: lerp(1, 1.28, u), lens: "push" }; }
  if (t < 30) return null;
  if (t < 40) return { kind: "full", rect: { x: 0, y: 0, w: 1920, h: 1080 }, face: { x: 820, y: 220, w: 280, h: 340 }, zoom: 1, lens: "hold" };
  if (t < 53) return null;
  return { kind: "card", rect: { x: 160, y: 240, w: 560, h: 600 }, face: { x: 340, y: 330, w: 200, h: 240 }, zoom: 1, lens: "" };
}
// "boxhidden": his face on the full-frame A-roll, 3 % to the side every other 6 s (a reframe, not a held frame)
const arollFace = (t) => ({ x: 860 + (Math.floor(t / 6) % 2) * 60, y: 260, w: 240, h: 300 });
function seek(t) {
  const s = speakerAt(t), sp = $("spk").style;
  const plate = MODE === "plate" && t < 3;                            // the room plate opens the hook, the card hidden
  if (s && MODE !== "boxhidden" && !plate) Object.assign(sp, { display: "block", left: s.rect.x + "px", top: s.rect.y + "px", width: s.rect.w + "px", height: s.rect.h + "px" });
  else sp.display = "none";
  $("aroll").style.display = MODE === "boxhidden" ? "block" : "none";
  $("room").style.display = plate ? "block" : "none";
  $("scr").style.display = MODE === "plate" && t >= 24 && t < 30 ? "block" : "none";
  $("takeover").style.display = s || MODE === "boxhidden" ? "none" : "block";
  $("cap").style.display = t < 15 ? "block" : "none";                 // captions come and go; they never count as a group
  const n = t >= 5 && t < 12 ? 5 : t >= 14 && t < 17.4 ? 7 : 0;
  cards.forEach((c, i) => (c.style.display = i < n ? "block" : "none"));
}
if (MODE === "speaker") window.__speaker = (t) => { const s = speakerAt(t);
  return s ? { on: true, ...s } : { on: false, kind: "off", rect: null, face: null, zoom: 1, lens: "" }; };
window.__faceRect = (t) => { const s = MODE === "boxhidden" ? { face: arollFace(t) } : MODE === "plate" && t < 3 ? null : speakerAt(t);
  return s ? { left: s.face.x, top: s.face.y, right: s.face.x + s.face.w, bottom: s.face.y + s.face.h } : null; };
// an old box page whose box stays hidden (op 0): precheck's layout and speaker sections must not read that as "off"
if (MODE === "boxhidden") window.__box = { rect: () => ({ cx: 1480, cy: 540, w: 560, h: 600, op: 0 }) };
window.__trans = [{ t: 20, kind: "whip", why: "to the push" }, { t: 24, kind: "whip", why: "into the takeover" }, { t: 30, kind: "zoom", why: "back to him" },
  { t: 40, kind: "cut", why: "a second takeover" }, { t: 53, kind: "cut", why: "back to him" }];
let now = 0;
window.__timelines = { "speaker-fixture": { seek(t) { now = t; seek(t); return this; }, duration: () => 60, time: () => now } };
seek(0);
</script>
</body></html>
