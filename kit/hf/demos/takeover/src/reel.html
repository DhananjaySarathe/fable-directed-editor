<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!--HF:KIT-->
  </head>
  <body>
    <div id="root" data-composition-id="reel" data-start="0" data-duration="__TOTAL__" data-width="1080" data-height="1920" style="position:relative;width:1080px;height:1920px;overflow:hidden">
      <img id="aroll" src="assets/room916.jpg" alt="" />
    </div>
    <script>
      /*DATA*/
      // FIXTURE (kit/hf/demos/takeover/build.py): S.takeover on HF.reel { look: "whitespace" } (9:16): a statement on a cut,
      // an evidence close-up out of the pill. The scenes size themselves for the portrait frame. Made-up copy.
      (function () {
        const tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["reel"] = tl;                                            // the linter looks for this line
        const ROOT = document.getElementById("root");
        const K = HF.kit({ tl, id: "reel", width: 1080, height: 1920, words: [], pieces: D.pieces });
        const st = HF.stage(K, ROOT, { aroll: "aroll" });
        const S = HF.reel(K, ROOT, st, { end: D.total, talk: D.total - 0.3, look: "whitespace", label: "fixture · takeovers" });
        document.getElementById("aroll").style.cssText = "position:absolute;left:0;top:0;width:1080px;height:1920px";   // a still, not a <video>
        const { beat, layer, line } = S, T = D.total;
        beat(0, "face");
        beat(2.5, "beside", { side: "top" });
        { const L = layer(2.5, 6); line(L, "One take in.|One film *out.", 2.7, { x: 60, y: 330, w: 960, size: 92 }); }
        S.takeover(6, 10.5, { kind: "type", in: "cut", kicker: "the rule", text: "Neat|beats busy.", mark: { word: 0, t: 7.4, kind: "underline" }, out: "fade" });
        { const L = layer(10.7, 12.5); line(L, "The camera|carries *it.", 10.9, { x: 60, y: 330, w: 960, size: 92 }); }
        beat(12.5, "face");
        const row = (n, s, on) => `<div style="display:flex;gap:22px;align-items:baseline;padding:16px 36px;font:500 36px/1.3 ${HF.F.mono};color:${on ? HF.C.ink : HF.C.sub}"><span style="color:${HF.C.mute};width:50px">${n}</span><span>${s}</span></div>`;
        S.takeover(14, 18.5, { kind: "evidence", in: "card", url: "localhost:3000", html: `<div style="padding:30px 0">${row("01", "cut: whole sentences")}${row("02", "lens: push, pull, arc")}${row("03", "takeover: he steps out", true)}${row("04", "mix: one calm bed")}</div>`,
          mark: [20, 178, 900, 66], markAt: 15.4, note: "a mock-up made for this check", noteAt: 16.9, out: "fade" });
        beat(21, "hero");                                                            // his card centred under a line
        { const L = layer(21, 24.6); line(L, "Not more|*elements.", 21.2, { x: 60, y: 300, w: 960, size: 92, align: "center" }); }
        { const L = layer(24.6, T); line(L, "The camera|does the *rest.", 24.8, { x: 60, y: 300, w: 960, size: 92, align: "center" }); }
        S.box();
        K.finish(T);
      })();
    </script>
  </body>
</html>
